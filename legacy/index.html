<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Andes Ferretero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#011D36; --navy-2:#0A2A4A; --navy-3:#123A63; --naranjo:#FE6F00; --naranjo-600:#E05F00; --naranjo-050:#FFF1E6;
  --azul:#2A62A8; --serie-2:#E8700F;
  --bg:#EEF2F6; --surface:#fff; --surface-2:#F6F8FB; --linea:#DDE4EC; --linea-soft:#EEF2F6;
  --texto:#0F1E2E; --muted:#5A6B7D; --faint:#97A6B6;
  --ok:#1E7B4E; --ok-bg:#E1F3E9; --warn:#9A5B00; --warn-bg:#FFF0D9; --crit:#B3261E; --crit-bg:#FCE4E2;
  --sombra:0 1px 2px rgba(1,29,54,.06),0 8px 24px rgba(1,29,54,.07); --radio:14px;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; --display:'Barlow Condensed','Inter',sans-serif;
}
*{box-sizing:border-box} html,body{margin:0}
body{font-family:var(--sans);color:var(--texto);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}
a{color:var(--azul)}
.hidden{display:none!important}
/* ---- barra superior ---- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.tb1{display:flex;align-items:center;gap:18px;padding:10px 22px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;flex:0 0 auto}
.brand svg{width:46px;height:auto}
.wm{font-family:var(--display);font-weight:800;font-size:25px;line-height:.88;letter-spacing:.01em}
.wm b{display:block;color:var(--naranjo);font-weight:800}
.wm small{display:block;font-family:var(--sans);font-size:8.5px;letter-spacing:.2em;color:#C9D4E0;margin-top:3px;font-weight:500}
.topsearch{flex:1;max-width:420px;position:relative}
.topsearch input{width:100%;padding:9px 12px 9px 34px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff}
.topsearch input::placeholder{color:#9FB2C6}
.topsearch span{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.7}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.segtag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#FFB070;text-align:right;line-height:1.35;font-weight:600}
.user{display:flex;align-items:center;gap:10px;cursor:pointer;position:relative;padding:4px 6px;border-radius:10px}
.user:hover{background:rgba(255,255,255,.07)}
.user .n{font-weight:600;font-size:13px}.user .r{font-size:11px;color:#9FB2C6}
.av{width:36px;height:36px;border-radius:50%;background:var(--naranjo);display:flex;align-items:center;justify-content:center;font-weight:700}
.umenu{position:absolute;right:0;top:48px;background:#fff;color:var(--texto);border-radius:12px;box-shadow:var(--sombra);padding:8px;min-width:190px}
.umenu a{display:block;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--texto)}
.umenu a:hover{background:var(--surface-2)}
.modbar{background:var(--navy-2);border-top:1px solid rgba(255,255,255,.06);padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.topmod{background:none;border:0;color:#D5DEE8;padding:12px 14px;font-weight:600;font-size:13.5px;border-bottom:3px solid transparent;white-space:nowrap}
.topmod:hover{color:#fff}
.topmod.active{color:#fff;border-bottom-color:var(--naranjo)}
.topmod .cae{font-size:10px;opacity:.7;margin-left:4px}
.navdrop{position:fixed;z-index:40;background:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(1,29,54,.22);padding:6px;min-width:230px}
.navdrop button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;font-weight:500;color:var(--texto)}
.navdrop button:hover,.navdrop button.active{background:var(--naranjo-050);color:var(--naranjo-600)}
/* ---- contenido ---- */
.content{padding:24px 26px 60px;max-width:1500px;margin:0 auto}
.page-head{margin:0 0 18px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head .t{flex:1;min-width:260px}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--naranjo-600);font-weight:700;margin:0 0 4px}
h2{font-family:var(--display);font-size:34px;margin:0;color:var(--navy);font-weight:700;letter-spacing:.005em}
.sub{color:var(--muted);margin:6px 0 0;max-width:880px;line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:0 0 18px}
.kpi{background:#fff;border-radius:var(--radio);padding:16px 18px;box-shadow:var(--sombra);border-top:3px solid var(--navy)}
.kpi.o{border-top-color:var(--naranjo)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--display);font-size:32px;font-weight:700;color:var(--navy);line-height:1.1;margin-top:4px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.panel{background:#fff;border-radius:var(--radio);box-shadow:var(--sombra);margin:0 0 18px;overflow:hidden}
.ph{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--linea-soft);flex-wrap:wrap}
.ph h3{margin:0;font-size:15.5px;color:var(--navy);flex:1}
.hint{font-size:12px;color:var(--muted)}
.pb{padding:16px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:18px}
@media (max-width:980px){.grid2,.grid3{grid-template-columns:1fr}.tb1{flex-wrap:wrap}.segtag{display:none}}
.tw{overflow:auto;max-height:70vh}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--linea-soft);vertical-align:top}
th{position:sticky;top:0;background:var(--surface-2);color:var(--navy);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;z-index:1;white-space:nowrap}
th[data-sort]{cursor:pointer;user-select:none}
tr.click{cursor:pointer} tr.click:hover td{background:#F9FBFD}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.crit{background:var(--crit-bg);color:var(--crit)}
.tag.nav{background:#E3ECF7;color:var(--navy-3)} .tag.or{background:var(--naranjo-050);color:var(--naranjo-600)}
.btn{border:1px solid var(--linea);background:#fff;color:var(--navy);border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--navy-3)}
.btn.pri{background:var(--naranjo);border-color:var(--naranjo);color:#fff}.btn.pri:hover{background:var(--naranjo-600)}
.btn.nav{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--crit)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.inp,select.inp,textarea.inp{padding:8px 11px;border:1px solid var(--linea);border-radius:9px;background:#fff;color:var(--texto);min-width:0}
.inp:focus{outline:none;border-color:var(--naranjo);box-shadow:0 0 0 3px var(--naranjo-050)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--navy)}
.form label.full{grid-column:1/-1}
.form .inp{width:100%;font-weight:400}
.items td{padding:4px 5px}.items .inp{width:100%;padding:6px 8px}
.items td.num .inp{text-align:right}
.tot{display:grid;grid-template-columns:auto auto;gap:6px 22px;justify-content:end;font-variant-numeric:tabular-nums;margin-top:12px}
.tot b{font-family:var(--display);font-size:22px;color:var(--navy)}
.ovl{position:fixed;inset:0;background:rgba(1,29,54,.5);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.3);width:100%;max-width:760px;padding:22px 24px}
.modal.ancho{max-width:1100px}
.modal h3{font-family:var(--display);font-size:26px;color:var(--navy);margin:0 0 4px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;transition:.2s;z-index:80;pointer-events:none;border-left:4px solid var(--naranjo)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;min-height:120px}
.col h4{margin:2px 4px 10px;font-size:12.5px;color:var(--navy);display:flex;justify-content:space-between}
.card{background:#fff;border-radius:10px;padding:10px 11px;margin-bottom:8px;box-shadow:0 1px 2px rgba(1,29,54,.08);cursor:pointer;border-left:3px solid var(--navy-3);font-size:12.5px}
.card:hover{border-left-color:var(--naranjo)}
.card .h{font-weight:700;color:var(--navy)}
.funnel .row{display:flex;align-items:center;gap:10px;margin:6px 0}
.funnel .lbl{width:190px;font-size:12.5px;font-weight:600}
.funnel .b{height:22px;border-radius:0 4px 4px 0;background:var(--azul)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;z-index:90;background:var(--navy);color:#fff;border-radius:8px;padding:7px 10px;font-size:12px;pointer-events:none;box-shadow:var(--sombra)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.foot{color:var(--faint);font-size:11.5px;text-align:center;margin-top:30px}

/* ---- oportunidades (pipeline tipo Salesforce) ---- */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--linea);margin:4px 0 14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--navy);border-bottom-color:var(--naranjo)}
.tabs .n{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;background:var(--surface-2);font-size:11.5px;color:var(--muted)}
.tabs button.on .n{background:var(--navy);color:#fff}.tabs .n.crit{background:var(--crit-bg);color:var(--crit)}
.pipe{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(236px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.etapa{background:var(--surface-2);border-radius:12px;min-height:160px;display:flex;flex-direction:column}
.etapa.sobre{outline:2px dashed var(--naranjo);outline-offset:-2px;background:var(--naranjo-050)}
.eh{padding:10px 12px 9px;border-bottom:1px solid var(--linea)}
.eh .nm{font-weight:700;color:var(--navy);font-size:13px;line-height:1.25;display:flex;justify-content:space-between;gap:8px}
.eh .pc{font-family:var(--display);font-size:17px;color:var(--naranjo-600)}
.eh .sm{font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.eh .pr{height:4px;border-radius:4px;background:var(--linea);margin-top:8px;overflow:hidden}.eh .pr i{display:block;height:100%;background:var(--azul)}
.etapa.gan .pr i{background:var(--ok)}.etapa.per .pr i{background:#C9D2DC}
.cards{padding:8px;display:grid;gap:8px}
.opp{background:var(--surface);border:1px solid var(--linea);border-radius:10px;padding:10px 11px;cursor:grab;box-shadow:0 1px 2px rgba(1,29,54,.05)}
.opp:hover{border-color:var(--azul)}.opp.arr{opacity:.45}
.opp .t{font-weight:700;color:var(--navy);font-size:13px}.opp .c{font-size:12.5px;margin-top:2px}
.opp .a{font-size:12px;color:var(--muted);margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.opp .f{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px;font-size:12px;font-variant-numeric:tabular-nums}
.opp .f b{font-size:13px}.opp.venc{border-left:3px solid var(--crit)}
.mas{font-size:12px;color:var(--muted);text-align:center;padding:4px}
.cli-card{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}.cli-card b{font-size:16px;margin-right:6px}.cli-card em{font-style:normal;color:var(--muted);font-size:12px}
.path{display:flex;gap:4px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px}
.path button{flex:1 0 auto;min-width:120px;border:0;padding:10px 20px 10px 26px;font-weight:600;font-size:12.5px;background:var(--surface-2);color:var(--muted);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);white-space:nowrap}
.path button:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);padding-left:16px;border-radius:8px 0 0 8px}
.path button.hecha{background:var(--ok-bg);color:var(--ok)}.path button.act{background:var(--navy);color:#fff}
.path button.perd{background:var(--crit-bg);color:var(--crit)}
.path button small{display:block;font-weight:500;opacity:.8;font-size:11px}
.pathbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-4px 0 16px}
/* ---- cotizador: respaldos y compradores ---- */
tr.resp td{padding-top:0!important;border-top:0!important}
.respb{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:0 0 10px 0}
.respb .inp{font-size:12.5px;padding:6px 9px}
.respb .ico{font-size:12px;color:var(--muted);white-space:nowrap}
.lnk{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--azul);text-decoration:none;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk:hover{text-decoration:underline}
.donde{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.prov{border:1px solid var(--linea);border-radius:12px;padding:12px 14px;background:var(--surface)}
.prov h4{margin:0 0 2px;color:var(--navy);font-size:14px}.prov .sm{font-size:12px;color:var(--muted);margin-bottom:8px;font-variant-numeric:tabular-nums}
.prov li{font-size:12.5px;padding:4px 0;border-top:1px solid var(--linea-soft);list-style:none}
.prov ul{margin:0;padding:0}
.fila-in{display:flex;gap:6px;align-items:center}.fila-in .inp{flex:1;min-width:0}
.comp{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--linea-soft);font-size:13px}
@media (max-width:640px){.respb{grid-template-columns:1fr}}
/* ---- rango de fechas y gráficos ---- */
.rango{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;background:var(--surface);border:1px solid var(--linea);border-radius:var(--radio);padding:12px 14px;margin:0 0 16px}
.rg-in{display:flex;gap:10px;flex-wrap:wrap}.rg-in label{display:grid;gap:4px;font-size:11.5px;font-weight:600;color:var(--muted)}.rg-in .inp{padding:6px 9px}
.rg-txt{font-size:12.5px;color:var(--navy);font-weight:600;margin-left:auto;font-variant-numeric:tabular-nums}
.dl{font-weight:700}.dl.up{color:var(--ok)}.dl.down{color:var(--crit)}
.hb{display:grid;gap:7px}.hr{display:grid;grid-template-columns:minmax(90px,34%) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--texto)}.ht{background:var(--surface-2);border-radius:4px;height:16px;overflow:hidden}.ht i{display:block;height:100%;border-radius:0 4px 4px 0}
.hr b{font-variant-numeric:tabular-nums;font-size:12.5px;min-width:64px;text-align:right}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.dn svg{flex:0 0 auto}
.dl-leg{display:grid;gap:6px;flex:1;min-width:200px}.dl-leg div{display:grid;grid-template-columns:12px 1fr auto 40px;gap:8px;align-items:center;font-size:12.5px}
.dl-leg i{width:12px;height:12px;border-radius:3px}.dl-leg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dl-leg b{font-variant-numeric:tabular-nums}.dl-leg em{font-style:normal;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.kpi .d .dl{margin-right:2px}
/* ---- cotizador ---- */
.drop{display:grid;gap:4px;justify-items:center;text-align:center;border:2px dashed var(--linea);border-radius:14px;padding:26px 16px;cursor:pointer;background:var(--surface-2)}
.drop:hover,.drop.on{border-color:var(--naranjo);background:var(--naranjo-050)}.drop b{color:var(--navy);font-size:15px}
.sol-it .ph h3{font-size:14.5px}.sol-it tr.eleg td{background:#F1F7EE}.rad{display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
/* ---- marketing y metas ---- */
.mk-card{background:var(--surface);border:1px solid var(--linea);border-top:4px solid;border-radius:var(--radio);padding:14px 16px;box-shadow:var(--sombra)}
.mk-h{display:flex;gap:12px;align-items:center}.mk-ico{width:38px;height:38px;border-radius:10px;color:#fff;font-weight:800;font-size:19px;display:grid;place-items:center;font-family:var(--display)}
.gauge .gbar{height:18px;border-radius:9px;background:var(--surface-2);overflow:hidden}.gauge .gbar i{display:block;height:100%;border-radius:9px}
.gauge .gtxt{margin-top:8px;font-size:14px;font-variant-numeric:tabular-nums}.gauge .gtxt b{font-size:22px;color:var(--navy);font-family:var(--display)}
/* ---- OC por gestionar ---- */
.og-t{font-size:15px;color:var(--navy);border-left:4px solid;padding-left:10px;margin:22px 0 10px}
.og .og-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px 8px}.og-acc{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.og-p{margin:0 16px 10px;padding:8px 12px;background:var(--warn-bg);border-radius:8px;font-size:13px;color:#5b3a00}
.og-l tr.pend td{background:#FFF8EC}.og-ev{margin:0 16px 12px;font-size:12.5px;color:var(--muted)}.og-ev ul{margin:6px 0 0;padding-left:18px}.og-ev summary{cursor:pointer;font-weight:600}
.iva-act{border-top:4px solid var(--naranjo)}.ia-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.ia-g div{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:grid;gap:3px}.ia-g span{font-size:12px;color:var(--muted)}.ia-g b{font-size:16px;font-variant-numeric:tabular-nums}
.ia-g .tot{background:var(--navy);color:#fff}.ia-g .tot span{color:#C9D4E0}.ia-g .tot b{font-size:19px;color:#fff}
.arch{display:inline-flex;gap:6px;align-items:center;margin:0 8px 6px 0;padding:4px 8px;border:1px solid var(--linea);border-radius:8px;background:var(--surface-2);font-size:12px}

<script>
"use strict";
// ============================================================ datos (Claude db) — reemplaza al servidor
const S={chunks:{}, t:{}, emp:{}, cats:[], db:null, dl:null, yo:{nombre:'',id:null}, colas:{}};
const ENT={
  clientes:{o:(a,b)=>cmp(a.nombre,b.nombre), q:['nombre','rut','contacto','giro','rubro','email','comuna']},
  proveedores:{o:(a,b)=>cmp(a.nombre,b.nombre), q:['nombre','rut','rubro','contacto','email','telefono','comuna','direccion']},
  productos:{o:(a,b)=>cmp(a.categoria,b.categoria)||cmp(a.descripcion,b.descripcion), q:['descripcion','codigo','categoria','marca','proveedor_ref']},
  precios:{o:(a,b)=>cmp(a.producto,b.producto), q:['producto','proveedor','fuente']},
  cotizaciones:{o:(a,b)=>cmp(b.fecha||'',a.fecha||'')||b.id-a.id, q:['numero','cliente','contacto','referencia','asunto','oc_numero']},
  oc_clientes:{o:(a,b)=>cmp(b.fecha||'9999',a.fecha||'9999')||b.id-a.id, q:['numero','cliente','destino','notas','guia','factura']},
  oc_proveedores:{o:(a,b)=>b.id-a.id, q:['numero','proveedor','oc_cliente','destino']},
  documentos:{o:(a,b)=>cmp(b.fecha||'',a.fecha||'')||b.id-a.id, q:['numero','cliente','rut','oc_ref','tipo']},
  licitaciones:{o:(a,b)=>cmp(b.cierre||'',a.cierre||''), q:['codigo','nombre','organismo','region']},
  actividades:{o:(a,b)=>b.id-a.id, q:['texto','entidad','usuario']},
  campanas:{o:(a,b)=>cmp(b.inicio||'',a.inicio||'')||b.id-a.id, q:['nombre','canal','segmento','objetivo']},
  solicitudes:{o:(a,b)=>cmp(b.fecha||'',a.fecha||'')||b.id-a.id, q:['cliente','comprador','asunto','referencia','planta','resumen']},
};
const LIM_CHUNK=185000, MAX_ACT=400;
function cmp(a,b){ a=a==null?'':String(a); b=b==null?'':String(b); return a<b?-1:a>b?1:0; }
const clon=o=>JSON.parse(JSON.stringify(o));
const hoy=()=>new Date().toISOString().slice(0,10);
const filas=t=>S.t[t]||(S.t[t]=[]);

function decodificar(d){ if(!d.cols) return d.filas||[]; const c=d.cols; return (d.filas||[]).map(a=>{ const o={}; c.forEach((k,i)=>{ if(a[i]!=null) o[k]=a[i]; }); return o; }); }
function reconstruir(t){ const ids=Object.keys(S.chunks).filter(k=>S.chunks[k].tabla===t).sort((a,b)=>S.chunks[a].n-S.chunks[b].n);
  S.t[t]=[]; ids.forEach(k=>{ decodificar(S.chunks[k]).forEach(r=>{ r.__c=k; if(t==='cotizaciones') migrarCot(r); if(t==='clientes') migrarCli(r); S.t[t].push(r); }); }); }
// Compradores por empresa: se arman desde el campo de contactos cuando aún no existen
function migrarCli(r){ if(Array.isArray(r.compradores)) return; r.compradores=String(r.contacto||'').split(/\s*[\/,;]\s*|\s+y\s+/).map(s=>s.trim()).filter(s=>s.length>2).map(n=>({nombre:n})); }
// Etapas antiguas → etapas del pipeline (10 % · 50 % · 60 % · 80 % · 100 %)
const ETAPA_ANT={Borrador:'Cotización enviada',Enviada:'Seguimiento','Negociación':'Contacto telefónico con el cliente',Declinada:'Perdida',
  'Contacto con el cliente':'Cotización enviada','Seguimiento al cliente':'Seguimiento','Cierre · dentro del negocio':'Contacto telefónico con el cliente','Decisión final del cliente':'Negocio por cerrarse'};
function migrarCot(r){ if(ETAPA_ANT[r.estado]) r.estado=ETAPA_ANT[r.estado]; if(!r.estado) r.estado='Cotización enviada';
  if(!r.total_neto&&r.items&&r.items.length){ let v=0,c=0; r.items.forEach(i=>{ v+=(+i.cantidad||0)*(+i.precio_unit||0); c+=(+i.cantidad||0)*(+i.costo_unit||0); }); if(v){ r.total_neto=Math.round(v); r.costo_total=Math.round(c); } }
  if(!r.fecha_cierre&&r.fecha){ const d=new Date(r.fecha+'T12:00:00'); d.setDate(d.getDate()+30); r.fecha_cierre=d.toISOString().slice(0,10); } }

async function iniciarDatos(){
  const [db,dl,us]=await Promise.all([claude.use('db'),claude.use('downloads'),claude.use('user')]);
  if(!db) throw new Error('La base de datos no está disponible en esta vista. Abre la app desde Claude con tu cuenta.');
  S.db=db; S.dl=dl;
  if(us){ try{ const m=await us.me(); S.yo={nombre:m.name||'',id:m.id}; }catch(e){} }
  const [col,emp]=await Promise.all([db.collection('tablas').get(), db.doc('config/empresa').get()]);
  col.docs.forEach(d=>{ S.chunks[d.id]=clon(d.data()); });
  // Completa bloques que la lectura por colección no haya traído (se leen uno a uno hasta el primero que no existe)
  const TABLAS=['clientes','proveedores','productos','precios','cotizaciones','oc_clientes','oc_proveedores','documentos','licitaciones','actividades','contactos','campanas','solicitudes'];
  await Promise.all(TABLAS.map(async t=>{ for(let n=0;n<200;n++){ const id=t+'-'+n; if(S.chunks[id]) continue; const s=await db.doc('tablas/'+id).get(); if(!s.exists) break; S.chunks[id]=clon(s.data()); } }));
  S.emp=emp.exists?clon(emp.data()):{};
  S.cats=S.emp.__categorias||[];
  new Set(Object.values(S.chunks).map(c=>c.tabla)).forEach(reconstruir);
  // cambios de otros usuarios en vivo
  db.collection('tablas').onSnapshot(s=>{ const tocadas=new Set();
    s.docChanges().forEach(ch=>{ if(ch.doc.metadata.hasPendingWrites) return; const d=ch.doc.data(); if(!d) return;
      if(ch.type==='removed'){ delete S.chunks[ch.doc.id]; } else S.chunks[ch.doc.id]=clon(d); tocadas.add(d.tabla); });
    tocadas.forEach(reconstruir); }, ()=>{});
  db.doc('config/empresa').onSnapshot(s=>{ if(s.exists&&!s.metadata.hasPendingWrites){ S.emp=clon(s.data()); Object.assign(EMP,empresa()); } }, ()=>{});
  return col.size;
}
function empresa(){ const e=Object.assign({},S.emp); delete e.__categorias; return e; }

// Escritura segura: relee el bloque, aplica el cambio y lo guarda (una escritura a la vez por bloque).
function enCola(cid,fn){ const p=(S.colas[cid]||Promise.resolve()).then(fn,fn); S.colas[cid]=p.catch(()=>{}); return p; }
function bloqueDestino(t){
  const ks=Object.keys(S.chunks).filter(k=>S.chunks[k].tabla===t).sort((a,b)=>S.chunks[a].n-S.chunks[b].n);
  const ult=ks[ks.length-1];
  if(ult && JSON.stringify(S.chunks[ult]).length<LIM_CHUNK) return ult;
  const n=ult?S.chunks[ult].n+1:0; const id=t+'-'+n;
  S.chunks[id]=Object.assign({tabla:t,n,filas:[]}, t==='contactos'&&ult?{cols:S.chunks[ult].cols}:{}); return id;
}
function limpiar(r){ const o={}; Object.keys(r).forEach(k=>{ if(k!=='__c'&&r[k]!==undefined&&r[k]!==null&&r[k]!=='') o[k]=r[k]; }); return o; }
async function mutar(cid,fn){
  return enCola(cid,async()=>{
    const ref=S.db.doc('tablas/'+cid); const s=await ref.get();
    const d=s.exists?clon(s.data()):clon(S.chunks[cid]);
    fn(d); await ref.set(d); S.chunks[cid]=d; reconstruir(d.tabla);
  });
}
function codificar(d,r){ return d.cols?d.cols.map(k=>r[k]??null):limpiar(r); }
function posicion(d,id){ return d.cols?d.filas.findIndex(a=>a[d.cols.indexOf('id')]===id):d.filas.findIndex(f=>f.id===id); }
async function guardarFila(t,r){
  r=limpiar(r); const ex=filas(t).find(x=>x.id===r.id);
  const cid=ex?ex.__c:bloqueDestino(t);
  await mutar(cid,d=>{ const i=posicion(d,r.id); if(i>=0) d.filas[i]=codificar(d,r); else d.filas.push(codificar(d,r));
    if(t==='actividades'&&d.filas.length>MAX_ACT) d.filas=d.filas.slice(-MAX_ACT); });
  return r.id;
}
// Guarda muchas filas de una tabla agrupando por bloque (una escritura por bloque)
async function guardarVarias(t,rows){
  const porB={}; let nuevo=nuevoId(t);
  rows.forEach(r0=>{ const r=limpiar(r0); if(!r.id) r.id=nuevo++; const ex=filas(t).find(x=>x.id===r.id); const cid=ex?ex.__c:null; (porB[cid||'_n']=porB[cid||'_n']||[]).push(r); });
  for(const [cid,rs] of Object.entries(porB)){ let destino=cid; let pend=rs.slice();
    while(pend.length){ if(destino==='_n') destino=bloqueDestino(t); const lote=[]; let tam=JSON.stringify(S.chunks[destino]||{}).length;
      while(pend.length&&(cid!=='_n'||tam<LIM_CHUNK)){ const r=pend.shift(); lote.push(r); tam+=JSON.stringify(r).length; }
      await mutar(destino,d=>{ lote.forEach(r=>{ const i=posicion(d,r.id); if(i>=0) d.filas[i]=codificar(d,r); else d.filas.push(codificar(d,r)); }); });
      if(cid==='_n'&&pend.length){ const n=S.chunks[destino].n+1; destino=t+'-'+n; S.chunks[destino]={tabla:t,n,filas:[]}; } } }
}
// Registro de Compras y Ventas (RCV) del SII: CSV "Descargar detalles"
function leerRCV(texto){
  const lineas=texto.replace(/\r/g,'').split('\n').filter(l=>l.trim()); if(lineas.length<2) return {error:'El archivo está vacío.'};
  const sep=(lineas[0].split(';').length>=lineas[0].split(',').length)?';':',';
  const cab=lineas[0].split(sep).map(s=>s.trim().replace(/^"|"$/g,'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''));
  const col=(...ns)=>cab.findIndex(c=>ns.some(n=>c===n||c.startsWith(n)));
  const iTipo=col('tipo doc'), iRutC=col('rut cliente'), iRutP=col('rut proveedor'), iRaz=col('razon social'), iFol=col('folio'), iFec=col('fecha docto'), iEx=col('monto exento'), iNeto=col('monto neto'), iIva=col('monto iva recuperable','monto iva'), iTot=col('monto total');
  if(iFol<0||iNeto<0||iFec<0) return {error:'No reconozco el formato. Descarga desde el SII el CSV con «Descargar detalles» del Registro de Compras y Ventas.'};
  const compras=iRutP>=0&&iRutC<0; const num=v=>{ v=String(v||'').replace(/"/g,'').trim(); if(!v) return 0; return Math.round(+v.replace(/\./g,'').replace(',','.'))||0; };
  const fecha=v=>{ const m=String(v||'').match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/); return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):(String(v||'').match(/\d{4}-\d{2}-\d{2}/)||[''])[0]; };
  const TV={33:'Factura',34:'Factura',30:'Factura',32:'Factura',46:'Factura',39:'Factura',41:'Factura',56:'Nota de Débito',61:'Nota de Crédito'}, TC={33:'Factura de compra',34:'Factura de compra',30:'Factura de compra',32:'Factura de compra',46:'Factura de compra',56:'Factura de compra',61:'Nota de crédito de compra'};
  const docs=[]; lineas.slice(1).forEach(l=>{ const c=l.split(sep).map(s=>s.replace(/^"|"$/g,'').trim()); const td=parseInt(c[iTipo]); const tipo=(compras?TC:TV)[td]; if(!tipo||!c[iFol]) return;
    const neto=num(c[iNeto]), ex=iEx>=0?num(c[iEx]):0, iva=iIva>=0?num(c[iIva]):Math.round(neto*0.19);
    docs.push({tipo,tipo_sii:td,numero:String(c[iFol]),fecha:fecha(c[iFec]),rut:(c[compras?iRutP:iRutC]||'').replace(/\./g,''),cliente:c[iRaz]||'',monto:neto+ex,exento:ex||undefined,iva,total:iTot>=0?num(c[iTot]):neto+ex+iva,origen:'SII RCV',estado:compras?'Por pagar':'Por cobrar'}); });
  return {compras,docs}; }
async function importarRCV(texto){ const r=leerRCV(texto); if(r.error) return {ok:false,error:r.error};
  const normR=s=>String(s||'').replace(/\./g,'').toUpperCase(); let nuevos=0, act=0; const lote=[];
  r.docs.forEach(d=>{ const ex=filas('documentos').find(x=>x.tipo===d.tipo&&String(x.numero)===d.numero&&(!r.compras||!x.rut||!d.rut||normR(x.rut)===normR(d.rut)));
    if(ex){ act++; lote.push(Object.assign(clon(limpiar(ex)),{fecha:d.fecha||ex.fecha,monto:d.monto,iva:d.iva,exento:d.exento,total:d.total,rut:d.rut||ex.rut,cliente:ex.cliente||d.cliente,tipo_sii:d.tipo_sii,origen:'SII RCV'})); }
    else { nuevos++; lote.push(d); } });
  await guardarVarias('documentos',lote);
  const meses=[...new Set(r.docs.map(d=>d.fecha.slice(0,7)).filter(Boolean))].sort();
  const e=empresa(), hist=(e.rcv_importes||[]).slice(-30); hist.push({fecha:new Date().toISOString().slice(0,16).replace('T',' '),tipo:r.compras?'Compras':'Ventas',meses,filas:r.docs.length,nuevos,actualizados:act});
  await guardarEmpresa({rcv_importes:hist}); log('documentos',0,'Importó RCV del SII ('+(r.compras?'compras':'ventas')+'): '+nuevos+' nuevos, '+act+' actualizados');
  return {ok:true,compras:r.compras,nuevos,actualizados:act,meses}; }
async function borrarFila(t,id){ const ex=filas(t).find(x=>x.id===id); if(!ex) return; await mutar(ex.__c,d=>{ const i=posicion(d,id); if(i>=0) d.filas.splice(i,1); }); }
const nuevoId=t=>filas(t).reduce((m,r)=>Math.max(m,+r.id||0),0)+1;
async function guardarEmpresa(e){ await enCola('empresa',async()=>{ const ref=S.db.doc('config/empresa'); const s=await ref.get(); const d=s.exists?clon(s.data()):{};
  Object.assign(d,e); await ref.set(d); S.emp=d; }); }
async function log(entidad,eid,texto){
  const d=new Date(); const f=d.toISOString().slice(0,10)+' '+d.toTimeString().slice(0,5);
  try{ await guardarFila('actividades',{id:nuevoId('actividades'),fecha:f,entidad,entidad_id:eid,texto,usuario:S.yo.nombre||'Usuario'}); }catch(e){ console.warn(e); }
}

// ============================================================ "API" local (mismas rutas que la versión servidor)
const MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function listar(ent,q,limit){ const E=ENT[ent]; if(!E) return {error:'entidad'};
  let r=filas(ent).slice(); q=(q||'').trim().toLowerCase();
  if(q) r=r.filter(x=>E.q.some(k=>String(x[k]??'').toLowerCase().includes(q)));
  r.sort(E.o); return r.slice(0,limit||2000).map(x=>{ const o=Object.assign({},x); delete o.__c; return o; }); }
function cotGet(i){ const c=filas('cotizaciones').find(x=>x.id===i); if(!c) return {error:'no existe'};
  const o=clon(limpiar(c)); o.items=(o.items||[]).map((x,k)=>Object.assign({id:k+1},x));
  o.actividad=listar('actividades').filter(a=>a.entidad==='cotizaciones'&&a.entidad_id===i); return o; }
async function cotPost(b){
  const items=(b.items||[]).map((it,k)=>{ const o=limpiar(it); delete o.id; delete o.cot_id; o.orden=k+1; return o; }); delete b.items;
  const e=empresa(); const nuevo=!b.id;
  if(b.cliente_id&&!b.cliente){ const c=filas('clientes').find(x=>x.id===+b.cliente_id); b.cliente=c?c.nombre:null; }
  let row;
  b.numero=String(b.numero||'').trim();
  if(b.numero&&filas('cotizaciones').some(x=>String(x.numero)===b.numero&&x.id!==+b.id)) return {ok:false,error:'Ya existe una cotización con el N° '+b.numero+'. Usa otro número.'};
  if(!b.numero) delete b.numero;
  if(nuevo){ const n=parseInt(e.proximo_numero_cot||202);
    row=Object.assign({numero:String(n),fecha:hoy(),estado:'Cotización enviada',vendedor:e.vendedor},b,{id:nuevoId('cotizaciones'),creado:hoy()}); }
  else { row=Object.assign(clon(limpiar(filas('cotizaciones').find(x=>x.id===+b.id)||{})),b); row.id=+b.id; }
  row.items=items;
  const v=items.reduce((s,x)=>s+(+x.cantidad||0)*(+x.precio_unit||0),0), c=items.reduce((s,x)=>s+(+x.cantidad||0)*(+x.costo_unit||0),0);
  if(v){ row.total_neto=Math.round(v); row.costo_total=Math.round(c); }
  await guardarFila('cotizaciones',row);
  const usado=parseInt(row.numero), prox=parseInt(e.proximo_numero_cot||202);
  if(nuevo&&/^\d+$/.test(String(row.numero))&&usado>=prox) await guardarEmpresa({proximo_numero_cot:usado+1});
  log('cotizaciones',row.id,(nuevo?'Creó':'Actualizó')+' cotización '+row.numero+' ('+items.length+' ítems)');
  return {ok:true,id:row.id};
}
async function ocpPost(b){
  const items=(b.items||[]).map((it,k)=>{ const o=limpiar(it); delete o.id; o.orden=k+1; return o; }); delete b.items;
  const e=empresa(); const nuevo=!b.id; let row;
  if(nuevo){ row=Object.assign({numero:String(parseInt(e.proximo_numero_oc||58)).padStart(3,'0'),fecha:hoy(),estado:'Emitida'},b,{id:nuevoId('oc_proveedores')}); }
  else { row=Object.assign(clon(limpiar(filas('oc_proveedores').find(x=>x.id===+b.id)||{})),b); row.id=+b.id; }
  row.items=items; row.total_neto=Math.round(items.reduce((s,x)=>s+(+x.cantidad||0)*(+x.precio_unit||0),0));
  await guardarFila('oc_proveedores',row);
  if(nuevo) await guardarEmpresa({proximo_numero_oc:parseInt(e.proximo_numero_oc||58)+1});
  log('oc_proveedores',row.id,(nuevo?'Emitió':'Actualizó')+' OC proveedor '+row.numero);
  return {ok:true,id:row.id};
}
function margenHistorico(){ let v=0,c=0; filas('cotizaciones').forEach(x=>(x.items||[]).forEach(i=>{ if(i.costo_unit>0&&i.precio_unit>0){ v+=i.cantidad*i.precio_unit; c+=i.cantidad*i.costo_unit; } })); return v?1-c/v:0.30; }

// ============================================================ gráficos (SVG, una sola escala)
function barras(labels, series, opts){
  // series: [{nombre,color,valores}] · barras agrupadas con tooltip; eje en millones
  opts=opts||{}; const W=Math.max(560,labels.length*(series.length*26+34)), H=opts.h||230, pL=48, pB=34, pT=14;
  const max=Math.max(1,...series.flatMap(s=>s.valores))*1.1, n=labels.length, slot=(W-pL-10)/n, bw=Math.min(28,(slot-14)/series.length);
  const y=v=>pT+(H-pT-pB)*(1-v/max);
  let g=''; for(let i=0;i<=4;i++){ const v=max*i/4, yy=y(v); g+='<line x1="'+pL+'" x2="'+(W-6)+'" y1="'+yy+'" y2="'+yy+'" stroke="#E6ECF2"/><text x="'+(pL-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10.5" fill="#5A6B7D">'+(max>=1e6?(v/1e6).toFixed(v/1e6<10?1:0)+'M':nf(v))+'</text>'; }
  let b='';
  labels.forEach((l,i)=>{ const x0=pL+i*slot+(slot-bw*series.length-2*(series.length-1))/2;
    series.forEach((s,j)=>{ const v=s.valores[i]||0, x=x0+j*(bw+2), yy=y(v), h=Math.max(0,H-pB-yy);
      b+='<rect x="'+x+'" y="'+yy+'" width="'+bw+'" height="'+h+'" rx="3" fill="'+s.color+'" data-tip="'+esc(l+' · '+s.nombre+': '+(opts.fmt||clp)(v))+'"/>'; });
    if(n<=16||i%Math.ceil(n/16)===0) b+='<text x="'+(pL+i*slot+slot/2)+'" y="'+(H-12)+'" text-anchor="middle" font-size="11.5" fill="#0F1E2E" font-weight="600">'+esc(l)+'</text>'; });
  const leg=series.length>1?'<div class="legend">'+series.map(s=>'<span><i style="background:'+s.color+'"></i>'+esc(s.nombre)+'</span>').join('')+'</div>':'';
  return leg+'<div style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:'+Math.min(W,560)+'px;display:block">'+g+b+'</svg></div>';
}

function inicioPeriodo(fecha,c){ const d=dD(fecha); let y=d.getFullYear(), m=d.getMonth(); if(d.getDate()<c){ m--; if(m<0){m=11;y--;} } return isoD(new Date(y,m,c,12)); }

  const dw=(dD(h).getDay()+6)%7;
  const P={'hoy':[h,h],'sem':[sumaDias(h,-dw),h],'mes':[h.slice(0,8)+'01',h],'per':[ini,h],'ant':[sumaMeses(ini,-1),sumaDias(ini,-1)],'3p':[sumaMeses(ini,-2),h],'6p':[sumaMeses(ini,-5),h],'12p':[sumaMeses(ini,-11),h],'anio':[h.slice(0,4)+'-01-01',h],'trim':[h.slice(0,5)+String(Math.floor((+h.slice(5,7)-1)/3)*3+1).padStart(2,'0')+'-01',h],'semes':[h.slice(0,5)+(+h.slice(5,7)<=6?'01':'07')+'-01',h],'semant':+h.slice(5,7)<=6?[(+h.slice(0,4)-1)+'-07-01',(+h.slice(0,4)-1)+'-12-31']:[h.slice(0,4)+'-01-01',h.slice(0,4)+'-06-30'],'anioant':[(+h.slice(0,4)-1)+'-01-01',(+h.slice(0,4)-1)+'-12-31'],'todo':['2020-01-01',h]};

const enR=(f,R)=>!!f&&f.slice(0,10)>=R.desde&&f.slice(0,10)<=R.hasta;
function etiquetaPer(ini,fin,c){ const a=dD(ini), b=dD(fin); return c===1?MES_C[a.getMonth()][0].toUpperCase()+MES_C[a.getMonth()].slice(1)+' '+String(a.getFullYear()).slice(2):a.getDate()+' '+MES_C[a.getMonth()]+(a.getMonth()===0?' '+String(a.getFullYear()).slice(2):''); }
function periodos(R,datos){ // datos: fechas para acotar 'Todo' al primer movimiento real
  let desde=R.desde; if(RG.preset==='todo'&&datos&&datos.length){ const m=datos.filter(Boolean).sort()[0]; if(m) desde=m.slice(0,10); }
  const out=[]; const ag=RG.agr||'mes'; let n=0;
  if(ag==='dia'||ag==='semana'){ let ini=desde; if(ag==='semana'){ ini=sumaDias(desde,-((dD(desde).getDay()+6)%7)); } const paso=ag==='dia'?1:7;
    while(ini<=R.hasta&&n<120){ const fin=sumaDias(ini,paso-1), a=dD(ini); out.push({ini,fin,et:(ag==='semana'?'S ':'')+a.getDate()+' '+MES_C[a.getMonth()]}); ini=sumaDias(ini,paso); n++; } return out; }

  while(ini<=R.hasta&&n<60){ const sig=sumaMeses(ini,k), fin=sumaDias(sig,-1), a=dD(ini), yy=String(a.getFullYear()).slice(2);

function linea(labels,series,opts){ opts=opts||{}; const n=labels.length; if(!n) return '<div class="empty">Sin datos en este rango.</div>';
  const W=Math.max(520,n*64), H=opts.h||220, pL=48, pB=30, pT=14, pR=16; const max=Math.max(1,...series.flatMap(s=>s.valores))*1.1;

  const step=Math.ceil(n/12); labels.forEach((l,i)=>{ if(i%step===0||i===n-1) g+='<text x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="#0F1E2E" font-weight="600">'+esc(l)+'</text>'; });
  let s=''; series.forEach(se=>{ const pts=se.valores.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1));
    if(se.area) s+='<polygon points="'+x(0)+','+y(0)+' '+pts.join(' ')+' '+x(n-1)+','+y(0)+'" fill="'+se.color+'" opacity=".10"/>';
    s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+se.color+'" stroke-width="2.2" stroke-linejoin="round"/>'+se.valores.map((v,i)=>'<circle cx="'+x(i)+'" cy="'+y(v)+'" r="'+(i===n-1?4.5:3)+'" fill="'+se.color+'" stroke="#fff" stroke-width="1.5" data-tip="'+esc(labels[i]+' · '+se.nombre+': '+clp(v))+'"/>').join(''); });
  const leg=series.length>1?'<div class="legend">'+series.map(z=>'<span><i style="background:'+z.color+'"></i>'+esc(z.nombre)+'</span>').join('')+'</div>':'';

let _pdfjs=null;
function cargarScript(src){ return new Promise((ok,err)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>err(new Error('No se pudo cargar '+src)); document.head.appendChild(s); }); }
async function pdfjs(){ if(_pdfjs) return _pdfjs; await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'); window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; _pdfjs=window.pdfjsLib; return _pdfjs; }
// ---- archivos en la nube (assets de la app): se suben apenas se eligen
function tipoArchivo(f){ const t=String(f&&f.type||''); if(/^(application\/pdf|image\/(png|jpeg|gif|webp))$/.test(t)) return t; const n=String(f&&f.name||'').toLowerCase();
  if(n.endsWith('.pdf')) return 'application/pdf'; if(/\.jpe?g$/.test(n)) return 'image/jpeg'; if(n.endsWith('.png')) return 'image/png'; if(n.endsWith('.webp')) return 'image/webp'; return ''; }
const ERR_AS={too_large:'pesa más de 20 MB',unsupported_type:'formato no admitido (usa PDF, JPG o PNG)',quota_or_state:'se llenó el espacio de archivos de la app',not_granted:'falta permitir que la app guarde archivos',rate_limited:'espera un momento y vuelve a intentar',upstream_auth:'recarga la app e inicia sesión de nuevo'};
const errArchivo=e=>ERR_AS[e&&e.code]||(e&&e.message)||'error desconocido';
async function subirArchivo(as,f){ const tipo=tipoArchivo(f); if(!tipo) throw {code:'unsupported_type'};
  let u; try{ u=await as.upload(f,{type:tipo}); }catch(e){ if(e&&e.code==='store_unavailable'){ await new Promise(r=>setTimeout(r,1500)); u=await as.upload(f,{type:tipo}); } else throw e; }
  return {id:u.id,url:'/_blob/'+u.id,nombre:f.name||'archivo',tipo,kb:Math.max(1,Math.round((f.size||0)/1024)),clave:(f.name||'')+'|'+(f.size||0),subido:new Date().toISOString().slice(0,16).replace('T',' ')}; }
function unicos(arr){ const v=new Set(); return (arr||[]).filter(a=>{ const k=a.clave||a.nombre||a.id; if(v.has(k)) return false; v.add(k); return true; }); }
function listaArchivos(arr,quitar){ return (arr||[]).map((a,i)=>'<span class="arch"><a class="lnk" href="'+esc(a.url||('/_blob/'+a.id))+'" target="_blank" rel="noopener">📄 '+esc(a.nombre||'archivo')+'</a>'+(a.kb?'<span class="faint">'+a.kb+' KB</span>':'')+'<span class="tag ok">☁ en la nube</span>'+(quitar?'<button type="button" class="btn sm danger" data-qarch="'+i+'" title="Quitar de la lista">✕</button>':'')+'</span>').join('')||'<span class="faint">Sin documentos adjuntos.</span>'; }
// ---- PDF → texto por líneas (respeta las filas de la tabla)
async function textoPdf(buf){ const lib=await pdfjs(); const doc=await lib.getDocument({data:buf}).promise; const pags=[]; const n=Math.min(doc.numPages,80);
  for(let i=1;i<=n;i++){ const pg=await doc.getPage(i); const tc=await pg.getTextContent();
    const its=tc.items.filter(t=>t.str&&t.str.trim()).map(t=>({x:t.transform[4],y:t.transform[5],s:t.str.trim()})).sort((a,b)=>b.y-a.y||a.x-b.x);
    const filas_=[]; its.forEach(t=>{ const f=filas_.find(f=>Math.abs(f.y-t.y)<3); if(f) f.t.push(t); else filas_.push({y:t.y,t:[t]}); });
    pags.push({n:i,pg,texto:filas_.sort((a,b)=>b.y-a.y).map(f=>f.t.sort((a,b)=>a.x-b.x).map(o=>o.s).join('  ')).join('\n')}); }
  return {pags,total:doc.numPages}; }
async function imgPagina(pg){ const vp=pg.getViewport({scale:1.6}); const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height; await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise; return await new Promise(r=>cv.toBlob(r,'image/png')); }
// N° de ítem de las filas que parecen líneas de una tabla (empiezan con número y terminan en cantidad + unidad)
function numerosItem(t){ const re=/^\s*(\d{1,4})[.)]?\s+.*\d\s*(C\/U|UN|UND|UNI|UNID|CU|KG|KGS|MT|MTS|M|M2|M3|ML|LT|LTS|L|RO|ROLLO|PAR|JGO|JUEGO|CJ|CAJA|GL|GAL|PZA|PZ|SET|KIT|BOL|TAM|TIR|PLA|EA|PC|PCS|PQ|PAQ|UNIDAD|UNIDADES)\.?\s*$/i;
  const ns=[]; String(t||'').split('\n').forEach(l=>{ const m=l.match(re); if(m) ns.push(+m[1]); }); const u=[...new Set(ns)].sort((a,b)=>a-b); return u.length>=2?u:[]; }
function promptItems(texto,imgs,cab,falta){
  return 'Eres el asistente de compras de Andes Ferretero e Insumos SpA (Chile). '+(imgs?'Las imágenes adjuntas son páginas o fotos de':'Te paso el texto de')+' una solicitud de cotización de un cliente (petición de oferta, SOLPED, RFQ o correo).\n'+
    (falta?'En una lectura anterior se omitieron los ítems N° '+falta.join(', ')+'. Extrae SOLO esos ítems.\n':'Extrae TODOS los productos o servicios que piden cotizar, sin saltarte ninguno y sin inventar nada: si la tabla tiene 40 líneas, devuelve 40 ítems, en el mismo orden.\n')+
    'Para cada ítem copia tal cual los códigos que aparezcan: número de ítem o línea del cliente, N° de material / código del cliente / SKU, posición de la SOLPED (ej. 10027410/10), y la marca y el modelo o número de parte si vienen en la descripción.\n'+
    (cab?'Además extrae los datos del cliente que pide la cotización (la empresa compradora, NO Andes Ferretero ni un proveedor).\n':'')+
    'Responde únicamente JSON: {'+(cab?'"cliente": "", "rut": "", "telefono": "", "contacto": "nombre del comprador o analista", "email": "", "direccion": "lugar de entrega", "fecha_limite": "AAAA-MM-DD si indica plazo para responder", "referencia": "N° de petición/SOLPED/RFQ", ':'')+
    '"total_items_en_documento": número, "items": [{"item": "N° de ítem o línea tal como aparece", "codigo": "N° material / código del cliente / SKU", "pos": "posición SOLPED si aparece", "descripcion": "descripción completa tal como aparece", "cantidad": número, "unidad": "C/U, UN, CJ, MT, KG, LT, RO, PAR…", "marca": "", "modelo": "modelo o N° de parte", "especificacion": "medidas, material, norma, color y demás detalles"}]}.\n'+
    (texto?'Texto del documento (las columnas van separadas por dos espacios):\n'+texto:''); }
function normItems(a){ return (Array.isArray(a)?a:[]).filter(x=>x&&String(x.descripcion||'').trim()).map(x=>{ const q=typeof x.cantidad==='number'?x.cantidad:+String(x.cantidad??'1').replace(/\.(?=\d{3}\b)/g,'').replace(',','.');
  return {item:String(x.item??'').trim(),codigo:String(x.codigo??'').trim(),pos:String(x.pos??'').trim(),descripcion:String(x.descripcion).trim(),cantidad:q||1,unidad:String(x.unidad||'UN').trim(),
    especificacion:[x.marca&&!String(x.descripcion).toLowerCase().includes(String(x.marca).toLowerCase())?'Marca '+x.marca:'',x.modelo&&!String(x.descripcion).toLowerCase().includes(String(x.modelo).toLowerCase())?'Modelo '+x.modelo:'',x.especificacion||''].filter(Boolean).join(' · ')}; }); }
// Lee TODOS los ítems de los documentos: por bloques de páginas y con una segunda pasada si faltan ítems
async function extraerItems(sm,lim,files,libre,prog){
  prog=prog||(()=>{}); const maxI=lim&&lim.images?(lim.images.maxCount||0):0, porLote=Math.max(1,Math.min(maxI||1,6));
  const bloques=[], imgs=[];
  for(const f of files){ const tipo=tipoArchivo(f);
    if(tipo==='application/pdf'){ prog('Leyendo '+(f.name||'el PDF')+'…'); const r=await textoPdf(await f.arrayBuffer()); const chars=r.pags.reduce((s,p)=>s+p.texto.length,0);
      if(chars/Math.max(1,r.pags.length)<80){ if(maxI) for(const p of r.pags) imgs.push(await imgPagina(p.pg)); }
      else { let buf=''; r.pags.forEach(p=>{ const t='--- '+(f.name||'PDF')+' · página '+p.n+' ---\n'+p.texto+'\n'; if(buf&&buf.length+t.length>9000){ bloques.push({texto:buf}); buf=''; } buf+=t; }); if(buf) bloques.push({texto:buf}); } }
    else if(tipo.startsWith('image/')&&maxI) imgs.push(f); }
  if(libre&&libre.trim()) bloques.push({texto:libre.trim()});
  for(let i=0;i<imgs.length;i+=porLote) bloques.push({imgs:imgs.slice(i,i+porLote)});
  if(!bloques.length) throw new Error('no encontré texto ni imágenes legibles en los documentos');
  let cab=null, todos=[]; const esperados=new Set();
  for(let b=0;b<bloques.length;b++){ const bl=bloques[b]; prog('Leyendo ítems… parte '+(b+1)+' de '+bloques.length);
    const esp=bl.texto?numerosItem(bl.texto):[]; esp.forEach(n=>esperados.add(n));
    const r=await sm.json(promptItems(bl.texto,!!bl.imgs,!cab),{images:bl.imgs,modelTier:'complex'}); if(!cab&&r) cab=r;
    let its=normItems(r&&r.items); const tiene=new Set(its.map(x=>String(parseInt(x.item))));
    const falta=esp.filter(n=>!tiene.has(String(n)));
    if(falta.length&&bl.texto){ prog('Recuperando '+falta.length+' ítems que faltaban…'); const r2=await sm.json(promptItems(bl.texto,false,false,falta),{modelTier:'complex'}); its=its.concat(normItems(r2&&r2.items)); }
    todos=todos.concat(its); }
  const v=new Set(); todos=todos.filter(x=>{ const k=(x.item||'')+'|'+x.descripcion.toLowerCase().replace(/\s+/g,' '); if(v.has(k)) return false; v.add(k); return true; });
  const got=new Set(todos.map(x=>String(parseInt(x.item))));
  return {cab:cab||{},items:todos,esperados:esperados.size,faltan:[...esperados].filter(n=>!got.has(String(n)))}; }

function leerInformeAds(texto){ const L=texto.replace(/\r/g,'').split('\n').filter(l=>l.trim()); let hi=L.findIndex(l=>/campa|campaign/i.test(l)); if(hi<0) return [];
  const sep=[';',',','\t'].sort((a,b)=>L[hi].split(b).length-L[hi].split(a).length)[0];
  const sp=l=>{ const o=[]; let cur='', q=false; for(const ch of l){ if(ch==='"') q=!q; else if(ch===sep&&!q){ o.push(cur); cur=''; } else cur+=ch; } o.push(cur); return o.map(s=>s.trim()); };
  const cab=sp(L[hi]).map(s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''));
  const c=(...ns)=>cab.findIndex(h=>ns.some(n=>h.includes(n)));
  const iN=c('nombre de la campana','campaign name','campana','campaign'), iI=c('impresiones','impressions','impr.'), iC=c('clics en el enlace','clics','clicks','link clicks'), iG=c('importe gastado','costo','coste','cost','amount spent','gasto'), iL=c('resultados','clientes potenciales','leads','conversiones','conversions','results');
  const num=v=>{ v=String(v||'').replace(/[^\d.,-]/g,''); if(!v) return 0; if(/,\d{1,2}$/.test(v)) v=v.replace(/\./g,'').replace(',','.'); else v=v.replace(/[.,](?=\d{3}\b)/g,''); return +v||0; };
  return L.slice(hi+1).map(sp).filter(r=>r[iN]&&!/^total/i.test(r[iN])).map(r=>({nombre:r[iN],impresiones:iI>=0?num(r[iI]):0,clics:iC>=0?num(r[iC]):0,gasto:iG>=0?Math.round(num(r[iG])):0,leads:iL>=0?num(r[iL]):0})); }

// Registrar la factura de una OC despachada: crea la factura y deja la OC como Facturada
function facturarOC(o){
  modal('<h3>Registrar factura · OC '+esc(o.numero)+'</h3><p class="sub">'+esc(String(o.cliente||'').split(' — ')[0])+(o.guias.length?' · GD '+o.guias.join(', '):'')+(o.migo_?' · MIGO '+esc(o.migo_):'')+'</p>'+
    '<form class="form" id="ffo" style="margin-top:12px"><label>N° factura<input class="inp" name="numero" required></label><label>Fecha<input class="inp" type="date" name="fecha" value="'+hoyIso()+'"></label><label>Monto neto<input class="inp" type="number" name="monto" value="'+(o.monto_||'')+'"></label><label>MIGO / HES<input class="inp" name="migo" value="'+esc(o.migo_||'')+'"></label></form>'+
    '<div class="mfoot"><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn pri" id="foOk">Guardar factura</button></div>');
  $('foOk').onclick=async()=>{ const f=Object.fromEntries(new FormData($('ffo'))); if(!f.numero){ toast('Indica el N° de factura'); return; }
    await post('/api/e/documentos',{tipo:'Factura',numero:f.numero,fecha:f.fecha,cliente:o.cliente,rut:o.cliente&&/ENAMI/.test(o.cliente)?'61703000-4':'',monto:+f.monto||0,iva:Math.round((+f.monto||0)*(EMP.iva||0.19)),oc_ref:o.numero,estado:'Por cobrar',nota:'GD '+o.guias.join(', ')+(f.migo?' · MIGO '+f.migo:'')});
    const ev=(o.evidencias||[]).concat([new Date().toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit'})+' Factura N° '+f.numero+' registrada']);
    await post('/api/e/oc_clientes',{id:o.id,estado:'Facturada',factura:f.numero,migo:f.migo,evidencias:ev,monto_neto:+f.monto||o.monto_neto||null});
    for(const g of o.guias){ const d=(await api('/api/e/documentos')).find(x=>(x.tipo||'').startsWith('Guía')&&String(x.numero)===g); if(d) await post('/api/e/documentos',{id:d.id,estado:'Facturada',nota:(d.nota?d.nota+' · ':'')+'Factura '+f.numero}); }
    cerrar(); toast('Factura '+f.numero+' registrada y OC '+o.numero+' marcada como facturada'); cobranza(); };
}

async function pagEmpresa(){
  const E=await api('/api/empresa'); const es=U.perfil==='Administrador';
  const c=[['razon_social','Razón social'],['nombre_corto','Nombre en documentos'],['rut','RUT'],['giro','Giro'],['direccion','Dirección'],['telefono','Teléfono'],['email','Correo'],['vendedor','Vendedor (cotizaciones)'],['iva','IVA (0,19)'],['margen_objetivo','Margen objetivo (0,30)'],['validez','Validez oferta (días)'],['proximo_numero_cot','Próximo N° cotización'],['proximo_numero_oc','Próximo N° OC proveedor'],['meta_mensual','Meta de facturación por período (CLP neto)'],['ppm_tasa','PPM (% sobre ventas netas, 0 si no aplica)'],['plazo_entrega','Plazo de entrega (texto)'],['lema','Lema'],['segmentos','Segmentos']];
  $('content').innerHTML=head('Configuración','Datos de la empresa','Estos datos salen en las cotizaciones y órdenes de compra en Excel.')+panel('Andes Ferretero e Insumos SpA','','<div class="pb"><form class="form" id="fe">'+c.map(([k,t])=>'<label class="'+(['plazo_entrega','giro','direccion'].includes(k)?'full':'')+'">'+t+'<input class="inp" name="'+k+'" value="'+esc(E[k]??'')+'"'+(es?'':' disabled')+'></label>').join('')+'</form>'+(es?'<div class="mfoot"><button class="btn pri" id="eOk">💾 Guardar</button></div>':'<p class="hint">Solo el Administrador puede editar.</p>')+'</div>');
  if(es) $('eOk').onclick=async()=>{ const r=await post('/api/empresa',Object.fromEntries(new FormData($('fe')))); if(r.ok){ toast('Datos guardados'); pagEmpresa(); } else toast(r.error||'Error'); };
}

async function actividad(){
  const r=await api('/api/e/actividades?limit=500');
  $('content').innerHTML=head('Configuración','Registro de actividad','Quién hizo qué y cuándo.')+panel('Últimos movimientos','',tabla('act',[{k:'fecha',t:'Fecha'},{k:'usuario',t:'Usuario'},{k:'texto',t:'Acción'}],r));
  TB.act.render=actividad;
}
async function buscarGlobal(q){
  const [c,o,cl,p]=await Promise.all([api('/api/e/cotizaciones?q='+encodeURIComponent(q)),api('/api/e/oc_clientes?q='+encodeURIComponent(q)),api('/api/e/clientes?q='+encodeURIComponent(q)),api('/api/e/productos?q='+encodeURIComponent(q)+'&limit=30')]);
  modal('<h3>Resultados para «'+esc(q)+'»</h3><div style="margin-top:10px">'+
    (cl.length?'<b>Clientes</b>'+cl.slice(0,8).map(x=>'<div style="padding:4px 0"><a href="#clientes" onclick="cerrar()">'+esc(x.nombre)+'</a></div>').join(''):'')+
    (c.length?'<b style="display:block;margin-top:10px">Cotizaciones</b>'+c.slice(0,12).map(x=>'<div style="padding:4px 0"><a href="#cot/'+x.id+'" onclick="cerrar()">N° '+esc(x.numero)+'</a> · '+esc(x.cliente||'')+' · '+esc((x.asunto||'').slice(0,60))+'</div>').join(''):'')+
    (o.length?'<b style="display:block;margin-top:10px">OC de clientes</b>'+o.slice(0,10).map(x=>'<div style="padding:4px 0"><a href="#oc_clientes" onclick="cerrar()">OC '+esc(x.numero)+'</a> · '+etiq(x.estado)+'</div>').join(''):'')+
    (p.length?'<b style="display:block;margin-top:10px">Productos</b>'+p.slice(0,10).map(x=>'<div style="padding:4px 0">'+esc(x.descripcion)+' <span class="hint">'+(x.precio_ref?clp(x.precio_ref):'')+'</span></div>').join(''):'')+
    (!cl.length&&!c.length&&!o.length&&!p.length?'<div class="empty">Sin resultados.</div>':'')+'</div><div class="mfoot"><button class="btn" onclick="cerrar()">Cerrar</button></div>');
}
